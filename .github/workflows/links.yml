name: Check URLs with Lychee

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 3 * * *"

jobs:
  Check-URLs:
    runs-on: ubuntu-latest
    steps:
      - name: Restore Lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.158.0"
          extended: true

      - name: Install Dart Sass
        run: |
          DART_SASS_VERSION="1.79.4"
          DART_SASS_URL="https://github.com/sass/dart-sass/releases/download"
          DART_SASS_TARBALL="dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          curl -LJO ${DART_SASS_URL}/${DART_SASS_VERSION}/${DART_SASS_TARBALL}
          tar -xf ${DART_SASS_TARBALL}
          rm ${DART_SASS_TARBALL}
          echo "$GITHUB_WORKSPACE/dart-sass" >> $GITHUB_PATH

      - name: Build site
        run: pipx run nox -s themes && pipx run nox -s html && pipx run nox -s search

      - name: Link checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Same as those in the PyBaMM repository
          args: |
            --cache
            --max-cache-age 3d .
            --verbose
            --no-progress
            --root-dir $GITHUB_WORKSPACE/public "public/**/*.html"
            --timeout 10
            --max-retries 5
            --skip-missing
            --exclude-loopback
            --exclude https://twitter.com/*
            --exclude "https://doi\.org|www.sciencedirect\.com/*"
            --exclude https://plausible.io/pybamm.org
            --exclude https://ecsarxiv.org/67ckj/
            --exclude https://scholar.google.com/
            --exclude "https://www\.robertwtimms\.com"
            --exclude "https://openresearchsoftware\.metajnl\.com"
            --exclude "https://.*\.hashnode\.dev"
            --exclude "https://medium\.com"
            --exclude "https://hub\.docker\.com"
            --exclude "file://.*/(slack|benchmarks)"
            --exclude-path ./themes
            --exclude-path ./static/teams/contributors.html
            --exclude-path ./content/gsoc/
            --exclude-path public/gsoc
            --exclude-path public/changelog
            --accept 200,429,999
          format: markdown
          jobSummary: true
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          GITHUB_WORKSPACE: ${{ github.workspace }}

      # TBD: automatically open an issue if any links fail
